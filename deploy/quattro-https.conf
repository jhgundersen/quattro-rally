server {
    listen 80;
    server_name quattro.jonh.no;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://quattro.jonh.no$request_uri; }
}
server {
    listen 443 ssl;
    server_name quattro.jonh.no;
    root /www/quattro;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/quattro.jonh.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quattro.jonh.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Docker DNS is resolved per request, so nginx also starts if the game server is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /server/ { return 404; }
    location ~ ^/multiplayer(?:/health)?$ {
        set $quattro_backend http://quattro-multiplayer:8081;
        proxy_pass $quattro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    add_header X-Content-Type-Options nosniff always;
}
