server {
    listen 80;
    server_name quattro.jonh.no;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://quattro.jonh.no$request_uri; }
}
server {
    listen 443 ssl;
    server_name quattro.jonh.no;
    root /www/quattro;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/quattro.jonh.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quattro.jonh.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    add_header X-Content-Type-Options nosniff always;
}
