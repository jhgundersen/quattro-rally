services:
  quattro-multiplayer:
    image: node:22-alpine
    command: ["node", "/runtime/watch.cjs"]
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    environment:
      NODE_ENV: production
      ORIGIN: https://quattro.jonh.no
      TRUST_PROXY: "1"
      PORT: "8081"
    volumes:
      - /srv/quattro/server:/app:ro
      - ./watch.cjs:/runtime/watch.cjs:ro
    networks: [website]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/multiplayer/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  website:
    external: true
    name: website_default
